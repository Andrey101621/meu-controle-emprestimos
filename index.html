<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#111827"
  >

  <meta
    name="description"
    content="Meu Controle de Empréstimos"
  >

  <link
    rel="manifest"
    href="./manifest.json"
  >

  <title>Meu Controle de Empréstimos</title>

  <style>

    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f3f4f6;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    .container {
      padding: 16px;
      max-width: 700px;
      margin: auto;
    }

    .dashboard {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 16px;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .card small {
      color: #6b7280;
    }

    .card strong {
      display: block;
      font-size: 19px;
      margin-top: 6px;
    }

    form {
      background: white;
      padding: 18px;
      border-radius: 14px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    form h2 {
      margin-top: 0;
    }

    input,
    button {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      margin-bottom: 12px;
      border-radius: 9px;
      border: 1px solid #d1d5db;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #111827;
    }

    button {
      background: #111827;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(.98);
    }

    .emprestimo {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .emprestimo h3 {
      margin-top: 0;
      font-size: 19px;
    }

    .valor {
      font-size: 20px;
      font-weight: bold;
    }

    .status {
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 12px;
      display: inline-block;
      margin: 5px 0 10px;
      font-weight: bold;
    }

    .aberto {
      background: #fef3c7;
      color: #92400e;
    }

    .pago {
      background: #dcfce7;
      color: #166534;
    }

    .success {
      background: #16a34a;
    }

    .danger {
      background: #dc2626;
    }

    .empty {
      text-align: center;
      color: #6b7280;
      padding: 30px;
      background: white;
      border-radius: 14px;
    }

    .secao {
      margin-top: 25px;
    }

    .info {
      color: #6b7280;
      font-size: 13px;
    }

  </style>
</head>

<body>

<header>
  <h1>💰 Meu Controle de Empréstimos</h1>
</header>

<div class="container">

  <div class="dashboard">

    <div class="card">
      <small>Total emprestado</small>
      <strong id="totalEmprestado">
        R$ 0,00
      </strong>
    </div>

    <div class="card">
      <small>Total recebido</small>
      <strong id="totalRecebido">
        R$ 0,00
      </strong>
    </div>

    <div class="card">
      <small>A receber</small>
      <strong id="totalAReceber">
        R$ 0,00
      </strong>
    </div>

    <div class="card">
      <small>Em aberto</small>
      <strong id="quantidadeAberta">
        0
      </strong>
    </div>

  </div>

  <form id="formEmprestimo">

    <h2>Novo empréstimo</h2>

    <input
      type="text"
      id="cliente"
      placeholder="Nome do cliente"
      required
    >

    <input
      type="tel"
      id="telefone"
      placeholder="Telefone"
    >

    <input
      type="number"
      id="valor"
      placeholder="Valor emprestado"
      step="0.01"
      min="0"
      required
    >

    <input
      type="number"
      id="parcelas"
      placeholder="Quantidade de parcelas"
      min="1"
      required
    >

    <input
      type="number"
      id="valorParcela"
      placeholder="Valor de cada parcela"
      step="0.01"
      min="0"
      required
    >

    <input
      type="date"
      id="vencimento"
      required
    >

    <button type="submit">
      ➕ Cadastrar empréstimo
    </button>

  </form>

  <div class="secao">

    <h2>📋 Meus empréstimos</h2>

    <div id="lista"></div>

  </div>

</div>

<script>

let emprestimos =
  JSON.parse(
    localStorage.getItem("emprestimos")
  ) || [];


function dinheiro(valor) {

  return Number(valor || 0).toLocaleString(
    "pt-BR",
    {
      style: "currency",
      currency: "BRL"
    }
  );

}


function salvar() {

  localStorage.setItem(
    "emprestimos",
    JSON.stringify(emprestimos)
  );

}


function atualizarDashboard() {

  let emprestado = 0;
  let recebido = 0;
  let aReceber = 0;
  let abertas = 0;

  emprestimos.forEach(e => {

    const valor =
      Number(e.valor || 0);

    const pago =
      Number(e.recebido || 0);

    emprestado += valor;

    recebido += pago;

    const restante =
      Math.max(valor - pago, 0);

    aReceber += restante;

    if (restante > 0) {
      abertas++;
    }

  });


  document.getElementById(
    "totalEmprestado"
  ).textContent =
    dinheiro(emprestado);


  document.getElementById(
    "totalRecebido"
  ).textContent =
    dinheiro(recebido);


  document.getElementById(
    "totalAReceber"
  ).textContent =
    dinheiro(aReceber);


  document.getElementById(
    "quantidadeAberta"
  ).textContent =
    abertas;

}


function formatarData(data) {

  if (!data) {
    return "-";
  }

  const partes =
    data.split("-");

  if (partes.length !== 3) {
    return data;
  }

  return `${partes[2]}/${partes[1]}/${partes[0]}`;

}


function mostrar() {

  const lista =
    document.getElementById("lista");

  lista.innerHTML = "";


  if (emprestimos.length === 0) {

    lista.innerHTML = `
      <div class="empty">
        <div style="font-size:40px;">💰</div>
        <p>Nenhum empréstimo cadastrado.</p>
        <p class="info">
          Cadastre seu primeiro empréstimo acima.
        </p>
      </div>
    `;

    atualizarDashboard();

    return;
  }


  emprestimos.forEach(
    (e, index) => {

      const recebido =
        Number(e.recebido || 0);

      const valor =
        Number(e.valor || 0);

      const restante =
        Math.max(
          valor - recebido,
          0
        );

      const quitado =
        restante <= 0;


      const div =
        document.createElement("div");

      div.className =
        "emprestimo";


      div.innerHTML = `

        <h3>
          👤 ${escapar(e.cliente)}
        </h3>

        <p>
          📱 ${
            escapar(
              e.telefone || "Sem telefone"
            )
          }
        </p>

        <p>
          💰 Valor emprestado:
          <strong>
            ${dinheiro(valor)}
          </strong>
        </p>

        <p>
          📅 Parcelas:
          ${e.parcelas}
        </p>

        <p>
          💵 Valor da parcela:
          ${dinheiro(e.valorParcela)}
        </p>

        <p>
          📆 Vencimento:
          ${formatarData(e.vencimento)}
        </p>

        <p>
          💳 Total recebido:
          ${dinheiro(recebido)}
        </p>

        <p>
          🔴 Saldo restante:
          <strong>
            ${dinheiro(restante)}
          </strong>
        </p>

        <span class="status ${
          quitado
            ? "pago"
            : "aberto"
        }">
          ${
            quitado
              ? "✓ QUITADO"
              : "● EM ABERTO"
          }
        </span>

        ${
          !quitado
            ? `
              <button
                class="success"
                onclick="registrarPagamento(${index})">
                💵 Registrar pagamento
              </button>
            `
            : ""
        }

        <button
          class="danger"
          onclick="excluir(${index})">
          🗑️ Excluir empréstimo
        </button>

      `;


      lista.appendChild(div);

    }
  );


  atualizarDashboard();

}


function escapar(texto) {

  return String(texto)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


document
  .getElementById("formEmprestimo")
  .addEventListener(
    "submit",
    function(event) {

      event.preventDefault();


      const novo = {

        id:
          Date.now(),

        cliente:
          document
            .getElementById("cliente")
            .value
            .trim(),

        telefone:
          document
            .getElementById("telefone")
            .value
            .trim(),

        valor:
          Number(
            document
              .getElementById("valor")
              .value
          ),

        parcelas:
          Number(
            document
              .getElementById("parcelas")
              .value
          ),

        valorParcela:
          Number(
            document
              .getElementById("valorParcela")
              .value
          ),

        vencimento:
          document
            .getElementById("vencimento")
            .value,

        recebido: 0

      };


      emprestimos.push(novo);

      salvar();

      mostrar();

      this.reset();


      alert(
        "Empréstimo cadastrado com sucesso!"
      );

    }
  );


function registrarPagamento(index) {

  const e =
    emprestimos[index];


  const restante =
    Number(e.valor)
    - Number(e.recebido || 0);


  const valor =
    prompt(
      `Saldo restante: ${dinheiro(restante)}

Digite o valor recebido:`
    );


  if (valor === null) {
    return;
  }


  const numero =
    Number(
      valor
        .replace(",", ".")
    );


  if (
    !Number.isFinite(numero)
    || numero <= 0
  ) {

    alert(
      "Digite um valor válido."
    );

    return;
  }


  if (numero > restante) {

    alert(
      "O pagamento não pode ser maior que o saldo restante."
    );

    return;
  }


  e.recebido =
    Number(e.recebido || 0)
    + numero;


  salvar();

  mostrar();


  alert(
    "Pagamento registrado com sucesso!"
  );

}


function excluir(index) {

  const cliente =
    emprestimos[index].cliente;


  if (
    confirm(
      `Excluir o empréstimo de ${cliente}?`
    )
  ) {

    emprestimos.splice(
      index,
      1
    );

    salvar();

    mostrar();

  }

}


mostrar();


/* ATIVAÇÃO DA PWA */

if (
  "serviceWorker"
  in navigator
) {

  window.addEventListener(
    "load",
    () => {

      navigator
        .serviceWorker
        .register("./sw.js")
        .then(
          () =>
            console.log(
              "PWA ativada com sucesso."
            )
        )
        .catch(
          erro =>
            console.error(
              "Erro ao ativar PWA:",
              erro
            )
        );

    }
  );

}

</script>

</body>
</html>
